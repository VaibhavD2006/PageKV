[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "pagekv"
version = "0.3.0"
description = "Page-local compact key summaries for efficient long-context LLM decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "kv-cache", "attention", "long-context", "inference", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.35",
    "matplotlib",
]

[project.optional-dependencies]
dev        = ["pytest", "pytest-cov"]
demo       = ["gradio>=4.0"]
vllm       = ["vllm>=0.4.0"]
embed      = ["sentence-transformers>=2.2"]
langchain  = ["langchain-core>=0.1"]
llamaindex = ["llama-index-core>=0.10"]

[project.urls]
Homepage   = "https://github.com/dandybee06/pagekv"
Issues     = "https://github.com/dandybee06/pagekv/issues"

[project.scripts]
pagekv-bench = "pagekv.benchmarks.run_all:main"

[project.entry-points."vllm.attention_backends"]
pagekv = "pagekv.integrations.vllm_backend:PageKVAttentionBackend"

[tool.setuptools.packages.find]
where   = ["."]
include = ["pagekv*"]

[tool.pytest.ini_options]
testpaths = ["pagekv/tests"]
